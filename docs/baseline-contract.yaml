version: 2
contract_name: attribution_protocol_run_record
description: Shared input/output contract for auditable attribution baseline runs.

input:
  dataset_id:
    type: string
    required: true
  split:
    type: string
    required: true
  question_id:
    type: string
    required: true
  question_text:
    type: string
    required: true
  source_snapshot_id:
    type: string
    required: true
  retrieval_config:
    type: object
    required: true
    fields:
      retriever_family: "bm25 | dense | hybrid | lexical | oracle"
      top_k: integer
      reranker: "none | named_reranker"
      evidence_budget: "maximum evidence items or tokens exposed to generation"

retrieved_evidence:
  type: list
  required: true
  item_fields:
    rank: integer
    evidence_id: string
    citation_id: "dataset_id/source_id/snapshot_hash/span_id/span_hash or null"
    dataset_id: string
    source_id: string
    source_uri: string
    snapshot_hash: "string or null"
    span_id: "string or null"
    span_hash: "string or null"
    text: string
    score: number
    retriever_name: string

answer:
  type: object
  required: true
  fields:
    global_answer: string
    refusal_label: "answered | insufficient_evidence | refused | empty"
    refusal_reason: "string or null"
    atomic_claims:
      type: list
      item_fields:
        claim_id: string
        claim_text: string
        answer_order: integer

citations:
  type: list
  required: true
  item_fields:
    claim_id: string
    raw_citation_id: string
    normalized_citation_id: string
    citation_source: "model_output | deterministic_mapping | verifier_adjusted"

citation_validation:
  type: list
  required: true
  item_fields:
    claim_id: string
    citation_id: string
    status: "valid_citation | nonexistent_citation_id | citation_id_not_in_retrieved_evidence | wrong_snapshot_hash | wrong_span_hash | malformed_citation_id | structurally_valid_but_semantically_unsupported_citation | overclaim_partially_supported_claim"
    structurally_valid: boolean
    semantic_status: "entailed | partially_supported | unsupported | contradictory | insufficient_evidence | not_checked | null"
    validator_name: string

verdicts:
  type: list
  required: true
  item_fields:
    claim_id: string
    verifier_enabled: boolean
    label: "entailed | partially_supported | unsupported | contradictory | insufficient_evidence | not_checked"
    score: "number or null"
    verifier_name: "string or null"
    rationale: "string or null"

run_metadata:
  type: object
  required: true
  fields:
    baseline_family: "vanilla_rag | citation_prompting_only | prompt_based_verifier | posthoc_nli_verifier | deterministic_citation_validator_only | ledger_pointer_only | ledger_pointer_validator | ledger_pointer_validator_semantic | ledger_trained_sft_dpo"
    run_id: string
    code_version: string
    config_version: string
    seed: integer
    latency_ms: number
    estimated_cost_usd: number
    notes: string

valid_baseline_families:
  - vanilla_rag
  - citation_prompting_only
  - prompt_based_verifier
  - posthoc_nli_verifier
  - deterministic_citation_validator_only
  - ledger_pointer_only
  - ledger_pointer_validator
  - ledger_pointer_validator_semantic
  - ledger_trained_sft_dpo

legacy_diagnostic_baseline_aliases:
  hybrid_rag: prompt_policy_slot_not_dense_hybrid_until_dense_retrieval_or_reranking_exists
  citation_only: citation_prompting_only
  validator_only: prompt_based_verifier
  ledger_only: ledger_pointer_only
  ledger_validator: ledger_pointer_validator_semantic

non_comparable_conditions:
  - different dataset split
  - different question list
  - different source snapshot
  - different evidence budget
  - hidden gold evidence in main run
  - missing citation_validation records for citation-capable baselines
  - lexical support rate reported as a core metric
