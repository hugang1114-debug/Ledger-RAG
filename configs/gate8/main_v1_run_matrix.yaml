baseline_families:
  - baseline_family: vanilla_rag
    requires_provider: true
    requires_generation: true
    requires_verifier: false
    requires_ledger: false
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: citation_prompting_only
    requires_provider: true
    requires_generation: true
    requires_verifier: false
    requires_ledger: false
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: prompt_based_verifier
    requires_provider: true
    requires_generation: true
    requires_verifier: true
    requires_ledger: false
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: posthoc_nli_verifier
    requires_provider: true
    requires_generation: true
    requires_verifier: true
    requires_ledger: false
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: deterministic_citation_validator_only
    requires_provider: true
    requires_generation: true
    requires_verifier: false
    requires_ledger: false
    requires_deterministic_validation: true
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: ledger_pointer_only
    requires_provider: true
    requires_generation: true
    requires_verifier: false
    requires_ledger: true
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: ledger_pointer_validator
    requires_provider: true
    requires_generation: true
    requires_verifier: false
    requires_ledger: true
    requires_deterministic_validation: true
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: ledger_pointer_validator_semantic
    requires_provider: true
    requires_generation: true
    requires_verifier: true
    requires_ledger: true
    requires_deterministic_validation: true
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
  - baseline_family: ledger_trained_sft_dpo
    requires_provider: true
    requires_generation: true
    requires_verifier: true
    requires_ledger: true
    requires_deterministic_validation: true
    retrieval_dependency: lexical_index_ready
    authorized_to_run: false
    status: planned_not_implemented

legacy_diagnostic_aliases:
  hybrid_rag: prompt_policy_slot_not_dense_hybrid_until_dense_retrieval_or_reranking_exists
  citation_only: citation_prompting_only
  validator_only: prompt_based_verifier
  ledger_only: ledger_pointer_only
  ledger_validator: ledger_pointer_validator_semantic

metric_groups:
  - attribution
  - replay
  - refusal
  - system
  - diagnostics
  - aggregation

shared_run_constraints:
  same_question_list: required
  same_source_snapshot: required
  same_evidence_budget: required
  same_answer_style: required
  same_metric_contract: required
  prompt_versions_locked: false
  provider_selected: false

artifact_paths:
  root: artifacts/gate8/main_v1
  runs: artifacts/gate8/main_v1/runs
  metrics: artifacts/gate8/main_v1/metrics
  logs: artifacts/gate8/main_v1/logs
  reports: artifacts/gate8/main_v1/reports
  created_by_this_config: false

blocked_reasons:
  - deterministic_pointer_validation_not_fully_integrated
  - semantic_support_evaluation_not_calibrated
  - stress_tests_not_completed
  - human_annotation_set_not_ready
  - cost_budget_unapproved
  - execution_card_missing
