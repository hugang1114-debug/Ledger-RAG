not_ready:
  - deterministic_pointer_validation_not_fully_integrated
  - semantic_support_evaluation_not_calibrated
  - stress_tests_not_completed
  - human_annotation_set_not_ready
  - cost_budget_unapproved
  - prompt_config_execution_unauthorized
  - provider_budget_execution_unauthorized
  - provider_evidence_registry_non_executable
  - freeze_readiness_unlocked
  - run_matrix_non_executable
  - run_commands_unauthorized
  - reproducibility_review_unfinished

authorization_rule: main comparison commands are unauthorized until all not_ready blockers are cleared in tracked protocol metadata.
