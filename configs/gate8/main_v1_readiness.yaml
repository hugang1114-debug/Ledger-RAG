version: 1
gate: gate8_main_comparison
status: readiness_in_progress
authorized_to_run: false
purpose: non_executable_readiness_matrix
snapshot_registry: snapshots/main_v1/source_snapshots.json
run_matrix: configs/gate8/main_v1_run_matrix.yaml
provider_decision: configs/gate8/provider_decision.yaml
freeze_readiness: configs/gate8/freeze_readiness.yaml
prompt_registry: configs/gate8/prompt_registry.yaml
generation_config_registry: configs/gate8/generation_config_registry.yaml
readiness_check:
  command: python scripts/check_gate8_snapshot_readiness.py --registry snapshots/main_v1/source_snapshots.json
  strict_command: python scripts/check_gate8_snapshot_readiness.py --registry snapshots/main_v1/source_snapshots.json --require-ready
  strict_mode_expected_exit_before_snapshots: 1
freeze_readiness_check:
  command: python scripts/check_gate8_freeze_readiness.py --freeze-config configs/gate8/freeze_readiness.yaml
  strict_command: python scripts/check_gate8_freeze_readiness.py --freeze-config configs/gate8/freeze_readiness.yaml --require-ready
  strict_mode_expected_exit_before_freeze: 1
prompt_config_readiness_check:
  command: python scripts/check_gate8_prompt_config_readiness.py --prompt-registry configs/gate8/prompt_registry.yaml --generation-config configs/gate8/generation_config_registry.yaml
  strict_command: python scripts/check_gate8_prompt_config_readiness.py --prompt-registry configs/gate8/prompt_registry.yaml --generation-config configs/gate8/generation_config_registry.yaml --require-ready
  strict_mode_expected_exit_before_prompt_config_freeze: 1
source_snapshot_builds:
  hotpotqa_dev_distractor:
    command: python scripts/build_hotpotqa_source_snapshot.py --registry snapshots/main_v1/source_snapshots.json --output-root datasets/source_snapshots --split dev_distractor
    authorized_scope: source_snapshot_only
    builds_retrieval_index: false
    runs_baselines: false
  2wikimultihopqa_dev:
    command: python scripts/build_2wiki_source_snapshot.py --registry snapshots/main_v1/source_snapshots.json --output-root datasets/source_snapshots --split dev
    authorized_scope: source_snapshot_only
    builds_retrieval_index: false
    runs_baselines: false
  musique_dev:
    command: python scripts/build_musique_source_snapshot.py --registry snapshots/main_v1/source_snapshots.json --output-root datasets/source_snapshots --split dev
    authorized_scope: source_snapshot_only
    builds_retrieval_index: false
    runs_baselines: false
retrieval_index_builds:
  main_v1_lexical:
    command: python scripts/build_gate8_lexical_indexes.py --registry snapshots/main_v1/source_snapshots.json --index-root datasets/retrieval_indexes/main_v1
    authorized_scope: lexical_index_artifacts_only
    index_root: datasets/retrieval_indexes/main_v1
    retriever_family: lexical
    calls_models: false
    runs_baselines: false
    runs_retrieval_evaluation: false

datasets:
  - id: hotpotqa
    name: HotpotQA
    decision: main_v1
    dataset_path: unset
    source_snapshot_id: unset
    raw_data_hash: unset
    processed_corpus_hash: unset
    split_hash: unset
    retrieval_index_path: unset
    license_note: unset
  - id: 2wikimultihopqa
    name: 2WikiMultihopQA
    decision: main_v1
    dataset_path: unset
    source_snapshot_id: unset
    raw_data_hash: unset
    processed_corpus_hash: unset
    split_hash: unset
    retrieval_index_path: unset
    license_note: unset
  - id: musique
    name: MuSiQue
    decision: main_v1
    dataset_path: unset
    source_snapshot_id: unset
    raw_data_hash: unset
    processed_corpus_hash: unset
    split_hash: unset
    retrieval_index_path: unset
    license_note: unset

baseline_families:
  - id: vanilla_rag
    name: Vanilla RAG
  - id: hybrid_rag
    name: Hybrid RAG
  - id: citation_only
    name: Citation-only
  - id: validator_only
    name: Validator-only
  - id: ledger_only
    name: Ledger-only
  - id: ledger_validator
    name: Ledger + Validator

metric_groups:
  - retrieval
  - answer_quality
  - attribution
  - system
  - aggregation

model_provider:
  selected: false
  provider: unset
  model: unset
  pricing_checked_at: unset
  pricing_source: unset

artifact_paths:
  root: artifacts/gate8/main_v1
  run_records: artifacts/gate8/main_v1/runs
  metric_records: artifacts/gate8/main_v1/metrics
  indexes: artifacts/gate8/main_v1/indexes
  created_by_this_config: false

not_ready:
  - dataset_paths_unset
  - source_snapshot_ids_unset
  - raw_data_hashes_unset
  - processed_corpus_hashes_unset
  - split_hashes_unset
  - retrieval_indexes_unbuilt
  - model_provider_unselected
  - cost_budget_unapproved
  - prompt_versions_unlocked
  - prompt_registry_unlocked
  - generation_config_registry_unlocked
  - provider_decision_unlocked
  - freeze_readiness_unlocked
  - provider_prompt_budget_not_frozen
  - run_matrix_non_executable
  - run_commands_unauthorized
  - reproducibility_review_unfinished

authorization_rule: main comparison commands are unauthorized until all not_ready blockers are cleared in tracked protocol metadata.
