readiness_check:
  command: python scripts/check_gate8_snapshot_readiness.py --registry snapshots/main_v1/source_snapshots.json
  strict_command: python scripts/check_gate8_snapshot_readiness.py --registry snapshots/main_v1/source_snapshots.json --require-ready
  strict_mode_expected_exit_after_snapshot_index_promotion: 0
snapshot_index_promotion_check:
  command: python scripts/check_gate8_snapshot_index_promotion.py --registry snapshots/main_v1/source_snapshots.json --readiness-config configs/gate8/main_v1_readiness.yaml
  promote_command: python scripts/promote_gate8_snapshot_indexes.py --registry snapshots/main_v1/source_snapshots.json --readiness-config configs/gate8/main_v1_readiness.yaml
  authorized_scope: metadata_promotion_only
  runs_baselines: false
  calls_models: false
  creates_result_artifacts: false
freeze_readiness_check:
  command: python scripts/check_gate8_freeze_readiness.py --freeze-config configs/gate8/freeze_readiness.yaml
  strict_command: python scripts/check_gate8_freeze_readiness.py --freeze-config configs/gate8/freeze_readiness.yaml --require-ready
  strict_mode_expected_exit_before_freeze: 1
prompt_config_readiness_check:
  command: python scripts/check_gate8_prompt_config_readiness.py --prompt-registry configs/gate8/prompt_registry.yaml --generation-config configs/gate8/generation_config_registry.yaml
  strict_command: python scripts/check_gate8_prompt_config_readiness.py --prompt-registry configs/gate8/prompt_registry.yaml --generation-config configs/gate8/generation_config_registry.yaml --require-ready
  strict_mode_expected_exit_before_prompt_config_freeze: 1
  candidate_expected_after_gate8l: true
  final_strict_mode_expected_exit_after_gate8l: 1
provider_evidence_readiness_check:
  command: python scripts/check_gate8_provider_evidence_readiness.py --registry configs/gate8/provider_evidence_registry.yaml
  strict_command: python scripts/check_gate8_provider_evidence_readiness.py --registry configs/gate8/provider_evidence_registry.yaml --require-ready
  strict_mode_expected_exit_before_provider_evidence_lock: 1
  provider_evidence_locked_expected_after_gate8r: true
provider_budget_preflight_check:
  command: python scripts/check_gate8_provider_budget_preflight.py --provider-candidates configs/gate8/provider_candidates.yaml --budget-preflight configs/gate8/budget_preflight.yaml
  strict_command: python scripts/check_gate8_provider_budget_preflight.py --provider-candidates configs/gate8/provider_candidates.yaml --budget-preflight configs/gate8/budget_preflight.yaml --require-ready
  smoke_authorization_command: python scripts/check_gate8_provider_budget_preflight.py --provider-candidates configs/gate8/provider_candidates.yaml --budget-preflight configs/gate8/budget_preflight.yaml --require-smoke-authorized
  preflight_expected_after_gate8m: true
  strict_mode_expected_exit_after_gate8m: 1
  smoke_authorization_expected_after_gate8o: true
source_snapshot_builds:
  hotpotqa_dev_distractor:
    command: python scripts/build_hotpotqa_source_snapshot.py --registry snapshots/main_v1/source_snapshots.json --output-root datasets/source_snapshots --split dev_distractor
    authorized_scope: source_snapshot_only
    builds_retrieval_index: false
    runs_baselines: false
  2wikimultihopqa_dev:
    command: python scripts/build_2wiki_source_snapshot.py --registry snapshots/main_v1/source_snapshots.json --output-root datasets/source_snapshots --split dev
    authorized_scope: source_snapshot_only
    builds_retrieval_index: false
    runs_baselines: false
  musique_dev:
    command: python scripts/build_musique_source_snapshot.py --registry snapshots/main_v1/source_snapshots.json --output-root datasets/source_snapshots --split dev
    authorized_scope: source_snapshot_only
    builds_retrieval_index: false
    runs_baselines: false
retrieval_index_builds:
