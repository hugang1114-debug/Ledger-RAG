  evidence_registry: configs/gate8/provider_evidence_registry.yaml
  checked_at: 2026-05-14
  execution_authorized: false
  recheck_required_on_run_date: true

provider_selection:
  primary_provider: deepseek_v4_pro
  optional_credibility_provider: openai_gpt_5_4
  provider_evidence_locked: true
  provider_evidence_registry: configs/gate8/provider_evidence_registry.yaml
  provider_decision: configs/gate8/provider_decision.yaml
  smoke_run_authorized: true
  smoke_run_scope: deepseek_v4_pro_smoke_only
  smoke_budget_ceiling_usd: 10
